tools:
- name: search_catalog
  category: catalog
  description: >-
    Search MALK products by natural-language query, filters, or both. Cursor-paginated.
    Response conforms to the UCP catalog search capability (dev.ucp.shopping.catalog.search).
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier; returns a single product.
- name: create_cart
  category: cart
  description: Create a new cart with line items, buyer contact, and localization context hints.
- name: get_cart
  category: cart
  description: Get the cart contents.
- name: update_cart
  category: cart
  description: Perform updates to a cart (line items, quantities, buyer information).
- name: cancel_cart
  category: cart
  description: Cancels a cart. Reversal path for cart creation.
- name: create_checkout
  category: checkout
  description: >-
    Creates a checkout. Returns line items, totals, and any applicable discounts or taxes.
- name: get_checkout
  category: checkout
  description: Returns checkout detail including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Updates a checkout (shipping address, shipping method, buyer detail).
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the order id / thank-you page URL or errors. Requires a
    meta.idempotency-key. Buyer must approve payment; agents must not finalize payment
    autonomously.
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout. Reversal path for checkout creation.
- name: get_order
  category: order
  description: Get the details of an order.
