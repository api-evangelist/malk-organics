notes: >-
  MALK Organics runs a live Shopify Universal Commerce Protocol (UCP) MCP server on its own
  host. An anonymous JSON-RPC tools/list POST returned HTTP 200 with 13 real tools and full
  inputSchemas, captured verbatim in malk-organics-mcp-tools.json. The store advertises the
  endpoint in its own /robots.txt, /agents.md and /.well-known/ucp merchant profile.
ownership: >-
  Served from malkorganics.com, MALK's own domain. The /.well-known/ucp merchant profile names
  merchant_name "MalkOrganics", merchant_origin "malkorganics.com" and Shopify shop id
  64317849670 - the same shop id as the OIDC issuer on the same host. Shopify is the platform
  implementing UCP; the store, catalog and merchant identity are MALK's.
