domain_standard:
  id: ucp
  name: Universal Commerce Protocol (UCP) 2026-04-08
  market: retail / direct-to-consumer e-commerce (agentic commerce)
  declared: true
  signature: >-
    The contract declares its own domain standard: /.well-known/ucp.json carries
    ucp.version "2026-04-08", a dev.ucp.shopping service bound to
    https://ucp.dev/2026-04-08/specification/overview/ over an MCP transport with the
    OpenRPC schema https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json, and eight
    namespaced capabilities (dev.ucp.shopping.checkout, .fulfillment, .discount, .cart,
    .order, .catalog.search, .catalog.lookup, plus the dev.shopify.catalog extension). Each
    tool description in the live tools/list response names the UCP capability it conforms to.
  spec: https://ucp.dev/2026-04-08/specification/overview/
  evidence_files:
  - well-known/malk-organics-ucp.json
  - mcp/malk-organics-mcp-tools.json
  operator_attribution:
    endpoint_on_provider_domain: true
    note: >-
      The UCP discovery document names the canonical service endpoint on the vendor domain
      (https://malkorganics.myshopify.com/api/ucp/mcp), but MALK's own /agents.md and
      /robots.txt publish https://malkorganics.com/api/ucp/mcp and that host answered
      tools/list with HTTP 200 and 13 tools on 2026-08-25. Both were probed; both are live.
      The implementation is Shopify's platform UCP, deployed under MALK's merchant identity
      (merchant_name MalkOrganics, merchant_origin malkorganics.com, shop id 64317849670).
