apis:
- name: MALK Organics Storefront Commerce (UCP / MCP)
  description: >-
    MALK Organics's agent-facing commerce API, implemented via the Shopify Universal Commerce
    Protocol (UCP) over MCP and served from MALK's own host. Agents can search and look up the
    MALK product catalog, create and update a cart, drive a buyer-approved checkout, and read
    order detail. Discoverable via /.well-known/ucp, /agents.md and /llms.txt. Read tools need
    no authentication; completing a checkout requires contemporaneous buyer approval.
  humanURL: https://malkorganics.com/agents.md
