aid: malk-organics
name: MALK Organics
description: >-
  MALK Organics is an Austin, Texas plant-based beverage company founded in 2015, making
  clean-label organic almond, oat, cashew, coconut and soy milks plus non-dairy creamers with
  six ingredients or less and no gums, oils or fillers, sold nationwide through Whole Foods,
  Target, Kroger, Publix, Albertsons, Costco, H-E-B, Sprouts, Wegmans, Erewhon and Amazon.
  MALK publishes no traditional developer program, but its Shopify-powered direct-to-consumer
  storefront at malkorganics.com exposes a real, live agent-commerce surface: a Universal
  Commerce Protocol (UCP) MCP server answering an anonymous tools/list with 13 catalog, cart,
  checkout and order tools; OpenID Connect / OAuth 2.0 Customer Accounts authentication; a
  /.well-known/ucp merchant profile; a hand-maintained /llms.txt AI content index authored by
  MALK marketing; and an /agents.md agent-instructions document. This profile captures that
  agent-native commerce surface.
